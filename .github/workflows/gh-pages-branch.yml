name: Publish docs to gh-pages branch

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/gh-pages-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dashboard files exist
        run: |
          test -f docs/index.html
          test -f docs/wk-dashboard.html
          test -f docs/dell-dashboard.html
          test -f docs/sr-link-dashboard.html
          test -f docs/management-dashboard.html

      - name: Publish docs/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
